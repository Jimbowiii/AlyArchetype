name: Build and publish AlyArchetype

on:
  push:
    branches:
      - main
    paths:
      - "version.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alyarchetype-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < version.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version.txt must contain a version like 1.2.1."
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" == "true" ]]; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              echo "Draft release $TAG found: it will be resumed."
            else
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "draft=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published. Nothing to do."
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "No release found for $TAG."
          fi

      - name: Validate required files
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in icon.png info.xml version.txt CHANGELOG.md; do
            test -f "$f" || { echo "::error::Missing file: $f"; exit 1; }
          done
          for d in sprites Strings theme; do
            test -d "$d" || { echo "::error::Missing directory: $d"; exit 1; }
          done
          for f in updater/Install-Updater.bat updater/AlyArchetype-Updater.bat updater/AlyArchetype.ico; do
            test -f "$f" || { echo "::error::Missing updater file: $f"; exit 1; }
          done

      - name: Extract release notes from CHANGELOG
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8-sig")

          pattern = re.compile(
              rf"(?ms)^#+[ \t]*\[{re.escape(version)}\][ \t]*\r?\n"
              rf"(.*?)"
              rf"(?=^#+[ \t]*\[\d+\.\d+\.\d+\][ \t]*\r?$|\Z)"
          )

          match = pattern.search(text)
          if not match or not match.group(1).strip():
              print(f"::error::No CHANGELOG section found for [{version}].")
              sys.exit(1)

          notes = match.group(1).strip() + "\n"
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Build AlyArchetype.zip
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/theme-package
          cp -a sprites Strings theme dist/theme-package/
          cp icon.png info.xml version.txt dist/theme-package/
          (cd dist/theme-package && zip -r ../AlyArchetype.zip .)

          ZIP_VERSION="$(unzip -p dist/AlyArchetype.zip version.txt | tr -d '\r\n[:space:]')"
          [[ "$ZIP_VERSION" == "${{ steps.version.outputs.version }}" ]] || {
            echo "::error::Version inside AlyArchetype.zip does not match version.txt."
            exit 1
          }

          unzip -Z1 dist/AlyArchetype.zip | grep -Fxq "info.xml"
          unzip -Z1 dist/AlyArchetype.zip | grep -Fxq "version.txt"

      - name: Build AlyArchetype-Updater.zip
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/updater-package
          cp updater/Install-Updater.bat dist/updater-package/
          cp updater/AlyArchetype-Updater.bat dist/updater-package/
          cp updater/AlyArchetype.ico dist/updater-package/
          (cd dist/updater-package && zip -r ../AlyArchetype-Updater.zip .)

      - name: Create or verify version tag
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create or resume draft release
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            [[ "$IS_DRAFT" == "true" ]] || {
              echo "::error::Release $TAG exists and is already published."
              exit 1
            }

            echo "Resuming existing draft $TAG."
            gh release edit "$TAG" \
              --title "AlyArchetype v${VERSION}" \
              --notes-file release-notes.md
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "AlyArchetype v${VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets with retry
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          asset_exists() {
            local name="$1"
            gh release view "$TAG" --json assets \
              --jq '.assets[].name' | grep -Fxq "$name"
          }

          upload_with_retry() {
            local file="$1"
            local name
            name="$(basename "$file")"

            if asset_exists "$name"; then
              echo "✅ $name already exists on the draft; keeping it."
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              echo "⬆️ Uploading $name (attempt $attempt/5)..."

              if gh release upload "$TAG" "$file"; then
                echo "✅ Uploaded $name."
                return 0
              fi

              # GitHub can occasionally finish an upload even if the client
              # receives an error response. Check before retrying.
              if asset_exists "$name"; then
                echo "✅ $name is present despite the upload error."
                return 0
              fi

              if [[ "$attempt" -lt 5 ]]; then
                WAIT=$((attempt * 20))
                echo "Upload failed; retrying in ${WAIT}s..."
                sleep "$WAIT"
              fi
            done

            echo "::error::Unable to upload $name after 5 attempts."
            return 1
          }

          # Small asset first, then the large theme archive.
          upload_with_retry "dist/AlyArchetype-Updater.zip"
          upload_with_retry "dist/AlyArchetype.zip"

      - name: Verify release assets
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$ASSETS"

          grep -Fxq "AlyArchetype.zip" <<< "$ASSETS" || {
            echo "::error::AlyArchetype.zip is missing from the release."
            exit 1
          }

          grep -Fxq "AlyArchetype-Updater.zip" <<< "$ASSETS" || {
            echo "::error::AlyArchetype-Updater.zip is missing from the release."
            exit 1
          }

          echo "✅ Both required assets are present."

      - name: Publish GitHub Release
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          gh release edit "$TAG" --draft=false --latest

          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [[ "$IS_DRAFT" == "false" ]] || {
            echo "::error::Release $TAG is still a draft."
            exit 1
          }

          echo "✅ Release $TAG published."

      - name: Announce release on Discord
        if: steps.release_state.outputs.published != 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          THREAD_ID="1538478149875146762"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          THEME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AlyArchetype.zip"
          UPDATER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AlyArchetype-Updater.zip"

          NOTES="$(cat release-notes.md)"
          NOTES="${NOTES:0:1200}"

          MESSAGE=$(cat <<EOF
          # **AlyArchetype v${VERSION} est disponible ! ✨**

          ${NOTES}

          > **🔄 Double-clique sur l'Updater pour mettre ton thème à jour !**
          > 📌 Tuto d'installation disponible dans le message épinglé.

          # **Téléchargements**
          > 🎨 AlyArchetype : ${THEME_URL}
          > 🔄 AlyArchetype Updater : ${UPDATER_URL}

          🔗 Release GitHub : ${RELEASE_URL}
          EOF
          )

          PAYLOAD="$(jq -n --arg content "$MESSAGE" '{content: $content}')"

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?thread_id=${THREAD_ID}&wait=true"
