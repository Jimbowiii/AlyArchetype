name: Build and publish AlyArchetype

on:
  push:
    branches:
      - main
    paths:
      - "version.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alyarchetype-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < version.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version.txt must contain a version like 1.0.4."
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check that release does not already exist
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required files
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in icon.png info.xml version.txt CHANGELOG.md; do
            test -f "$f" || { echo "::error::Missing file: $f"; exit 1; }
          done
          for d in sprites Strings theme; do
            test -d "$d" || { echo "::error::Missing directory: $d"; exit 1; }
          done
          for f in updater/Install-Updater.bat updater/AlyArchetype-Updater.bat updater/AlyArchetype.ico; do
            test -f "$f" || { echo "::error::Missing updater file: $f"; exit 1; }
          done

      - name: Extract release notes from CHANGELOG
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG section found for [$VERSION]."
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Build AlyArchetype.zip
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/theme-package
          cp -a sprites Strings theme dist/theme-package/
          cp icon.png info.xml version.txt dist/theme-package/
          (cd dist/theme-package && zip -r ../AlyArchetype.zip .)

          ZIP_VERSION="$(unzip -p dist/AlyArchetype.zip version.txt | tr -d '\r\n[:space:]')"
          [[ "$ZIP_VERSION" == "${{ steps.version.outputs.version }}" ]] || exit 1
          unzip -Z1 dist/AlyArchetype.zip | grep -Fxq "info.xml"
          unzip -Z1 dist/AlyArchetype.zip | grep -Fxq "version.txt"

      - name: Build AlyArchetype-Updater.zip
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/updater-package
          cp updater/Install-Updater.bat dist/updater-package/
          cp updater/AlyArchetype-Updater.bat dist/updater-package/
          cp updater/AlyArchetype.ico dist/updater-package/
          (cd dist/updater-package && zip -r ../AlyArchetype-Updater.zip .)

      - name: Create version tag
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AlyArchetype v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/AlyArchetype.zip
            dist/AlyArchetype-Updater.zip
          fail_on_unmatched_files: true

      - name: Announce release on Discord
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          THREAD_ID="1538478149875146762"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          THEME_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AlyArchetype.zip"
          UPDATER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AlyArchetype-Updater.zip"

          NOTES="$(cat release-notes.md)"
          NOTES="${NOTES:0:1200}"

MESSAGE=$(cat <<EOF
# **AlyArchetype v${VERSION} est disponible ! ✨**

${NOTES}

> **🔄 Double-clique sur l'Updater pour mettre ton thème à jour !**
> 📌 Tuto d'installation disponible dans le message épinglé.

# **Téléchargements**
> 🎨 AlyArchetype : ${THEME_URL}
> 🔄 AlyArchetype Updater : ${UPDATER_URL}

🔗 Release GitHub : ${RELEASE_URL}
EOF
)

          PAYLOAD="$(jq -n --arg content "$MESSAGE" '{content: $content}')"

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?thread_id=${THREAD_ID}&wait=true"

